apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "php-app.labels" . | nindent 6 }}
spec:
  replicas: {{ .Values.mysql.replicaCount }}
  selector:
  	matchLabels:
      app: mysql
    template:
      metadata:
        labels:
          app: mysql
          {{- include "php-app.labels" . | nindent 10 }}
      spec:
        containers:
					- name: mysql
						image: {{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}
						ports:
							- containerPort: {{ .Values.mysql.service.targetPort }}
						envFrom:
							- secretRef:
								name: {{ .Values.secret.name }}
						resources:
							requests:
								cpu: {{ .Values.mysql.resources.requests.cpu }}
								memory: {{ .Values.mysql.resources.requests.memory }}
							limits:
								cpu: {{ .Values.mysql.resources.limits.cpu }}
								memory: {{ .Values.mysql.resources.limits.memory }}
						volumeMounts:
							- name: mysql-storage
								mountPath: /var/lib/mysql
							- name: mysql-init
								mountPath: /docker-entrypoint-initdb.d
				volumes:
					- name: mysql-storage
						persistentVolumeClaim:
							claimName: {{ .Values.mysql.persistence.claimName }}
					- name: mysql-init
						configMap:
							name: mysql-init-scripts                    
